name: tests
on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'CHANGELOG.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'CHANGELOG.md'
jobs:
  test:
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.emacs_version == 'snapshot' }}
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - 28.2
          - 29.1
          - 29.4
          - 30.1
          - snapshot
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}
        timeout-minutes: 15
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvterm-dev
      - name: Run tests
        run: |
          chmod +x ./run_tests.sh
          ./run_tests.sh

# EOF